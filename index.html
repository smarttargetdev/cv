<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title>Currículo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="app" aria-live="polite">
  <p class="loading">Carregando currículo…</p>
</div>

<template id="tpl-root">
  <header class="header">
    <div class="header__inner">
      <div class="header__top">
        <p class="header__eyebrow"></p>
        <div class="header__controls">
          <div class="lang-switch" role="group" aria-label="Selecionar idioma"></div>
          <button type="button" class="print-btn"></button>
        </div>
      </div>
      <h1 class="header__name"></h1>
      <p class="header__role"></p>
    </div>
  </header>

  <nav class="subheader" aria-label="Informações de contato">
    <ul class="subheader__list"></ul>
  </nav>

  <main class="content">
    <div class="panels"></div>
  </main>

  <footer class="footer">
    <p>Dados carregados dinamicamente via AJAX a partir de <code>resume.json</code></p>
  </footer>
</template>

<template id="tpl-panel">
  <section class="panel">
    <h2 class="panel__header" role="button" tabindex="0" aria-expanded="true">
      <span class="panel__index"></span>
      <span class="panel__title"></span>
      <span class="panel__chevron" aria-hidden="true">▾</span>
    </h2>
    <div class="panel__body"></div>
  </section>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body>
</html>
